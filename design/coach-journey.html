<h1>Le carrosse relie l'accueil au domaine</h1><section>Identite valide → portail → voyage assis → visite libre → portail du chateau → retour assis.</section>
<svg viewBox="0 0 1000 310"><path d="M90 170 C250 10 300 290 470 160 S720 20 910 160" fill="none" stroke="#bba782" stroke-width="20"/><circle cx="90" cy="170" r="47" fill="#274e3b" stroke="#dec28b"/><rect x="870" y="70" width="65" height="100" fill="#a39476"/><text x="25" y="250">Accueil / portillon</text><text x="335" y="290">50 % : connexion observeur (aller)</text><text x="335" y="315">50 % : deconnexion totale (retour)</text><text x="760" y="220">Portail du chateau</text></svg>
<section>Aller : invisible jusqu'a l'arrivee. Retour : invisible des l'embarquement. Le carrosse reste toujours local. Miroirs et feux actifs uniquement pendant la visite.</section>
