<text x="360" y="845" font-size="12" fill="#687368">Terrain propose : environ 240 x 240 m • Implantation indicative, volumes et arbres schematiques</text>
<path d="M350 860h150m-150-5v10m150-10v10" stroke="#243b31" stroke-width="2"/><text x="425" y="884" text-anchor="middle" font-size="12">50 m</text>
<text x="40" y="147" font-size="18" font-weight="bold">01  ACCUEIL CONSERVE</text>
<text x="40" y="179" font-size="15"><tspan x="40">Pavillon, panneau, vegetaux,</tspan><tspan x="40" dy="23">decorations et spawn inchanges.</tspan></text>
<text x="40" y="251" font-size="18" font-weight="bold">02  DOMAINE EN ARRIERE-PLAN</text>
<text x="40" y="283" font-size="15"><tspan x="40">Chateau exterieur, fontaine,</tspan><tspan x="40" dy="23">parterres, bancs et clotures.</tspan><tspan x="40" dy="23">Ensemble decale vers l'avant droit.</tspan><tspan x="40" dy="23">Aucun amenagement interieur.</tspan></text>
<text x="40" y="402" font-size="18" font-weight="bold">03  FORET DE CHENES</text>
<text x="40" y="434" font-size="15"><tspan x="40">Modeles Blender de 6 a 20 m.</tspan><tspan x="40" dy="23">Silhouettes et tailles variees.</tspan><tspan x="40" dy="23">Clairiere devant la vue principale.</tspan></text>
<text x="40" y="540" font-size="18" font-weight="bold">04  DEPLACEMENT SECURISE</text>
<text x="40" y="572" font-size="15"><tspan x="40">Collision invisible fermee a 360°</tspan><tspan x="40" dy="23">au pourtour de la place.</tspan><tspan x="40" dy="23">Sol continu sous le spawn.</tspan><tspan x="40" dy="23">Paysage exterieur non accessible</tspan><tspan x="40" dy="23">depuis l'accueil.</tspan></text>
<rect x="35" y="743" width="275" height="65" rx="9" fill="#e7dcc5"/><text x="53" y="769" font-size="15" font-weight="bold">PLAN A VALIDER</text><text x="53" y="793" font-size="13">La creation 3D commencera ensuite.</text>
